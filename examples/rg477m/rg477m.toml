[image]
name = "rg477m"
label = "CANNOLI"
size = "auto"
reserve = "8GiB"
output = "dist/rg477m.img"

# Pinned Obtainium arm64 release for the RG477M (arm64-v8a).
[[source]]
id = "obtainium"
type = "github"
repo = "ImranR98/Obtainium"
tag = "v1.7.1"
asset = "app-arm64-v8a-release.apk"

# Pinned Obtainium Emulation Pack release. This is a single JSON asset, not an
# APK, so it is declared as a generic artifact below.
[[source]]
id = "emulation-pack"
type = "github"
repo = "RJNY/Obtainium-Emulation-Pack"
tag = "v8.0.1"
asset = "obtainium-emulation-pack-v8.0.1.json"

[[apk]]
source = "obtainium"
as = "Obtainium.apk"

# Fetch the emulation-pack JSON from its pinned GitHub release.
[[artifact]]
root = "card"
dest = "Obtainium"
source = "emulation-pack"
as = "obtainium-emulation-pack-v8.0.1.json"

# Local Obtainium import file that adds Tailscale and tracks its latest release.
[[artifact]]
root = "card"
dest = "Obtainium"
path = "obtainium-tailscale.json"
as = "tailscale.json"

# Requested platforms map to the pinned Cannoli tags below:
#   GB   -> Cannoli/Roms/GB
#   GBC  -> Cannoli/Roms/GBC
#   GBA  -> Cannoli/Roms/GBA
#   GG   -> Cannoli/Roms/GG
#   NGPC -> Cannoli/Roms/NGPC
#   NES  -> Cannoli/Roms/NES
#   SNES -> Cannoli/Roms/SNES
#   MD   -> Cannoli/Roms/MD
#   PS   -> Cannoli/Roms/PS
#   N64  -> Cannoli/Roms/N64
# The full Cannoli skeleton (all top-level directories, all 51 Roms tags,
# settings.json, and CREDITS.md) is created automatically; no ROM, BIOS, or art
# payload entries are needed or accepted.
