[image]
name = "demo"
label = "CANNOLI"
size = "auto"
reserve = "1MiB"
output = "dist/demo.img"

# ROMs, BIOS files, and box art are supplied by Cannoli/RomM; they are not
# manifest inputs. The card still gets the full Cannoli directory skeleton.

[[overlay]]
platform = "GBA"
path = "demo/overlays/GBA/bezel.png"

[[shader]]
path = "demo/shaders/crt-lamp"

[[apk]]
path = "demo/apks/Demo.apk"

[[artifact]]
root = "card"
dest = "Manuals"
path = "demo/manuals/readme.txt"
