[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbc-android-card-imager"
version = "0.1.0"
description = "Build and flash Cannoli-ready SD card images for Android SBC devices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "typer>=0.27,<0.28",
    "rich>=15,<16",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
]

[project.scripts]
sbc-imager = "sbc_imager.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_imager"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real loop/mount/fsck (Linux, sudo)",
]

[tool.coverage.run]
source = ["sbc_imager"]

[tool.coverage.report]
fail_under = 85
