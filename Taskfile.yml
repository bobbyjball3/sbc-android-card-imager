version: '3'

vars:
  DEVICE: '{{.DEVICE | default "rg477m"}}'
  SIZE_MIB: '{{.SIZE_MIB | default ""}}'
  IMAGE_DEVICE: '{{.IMAGE_DEVICE | default ""}}'
  # Absolute, derived from the Taskfile's own location, so staging and the
  # container mount resolve the same directory no matter where task is run.
  # The playbook's file/copy actions resolve relative paths against the
  # playbook dir while the container mount resolves them against the cwd; a
  # relative default split them and produced an empty image.
  REPO_ROOT: '{{.TASKFILE_DIR}}'
  PAYLOAD_DIR: '{{.PAYLOAD_DIR | default (printf "%s/build/payload" .TASKFILE_DIR)}}'
  DIST_DIR: '{{.DIST_DIR | default (printf "%s/dist" .TASKFILE_DIR)}}'

tasks:
  setup:
    desc: Install dependencies and git hooks
    cmds:
      - uv sync --all-groups
      - uv run pre-commit install --allow-missing-config

  lint:
    desc: Lint shell scripts and Ansible
    cmds:
      - shellcheck container/build-image.sh tests/*.sh
      - uv run ansible-lint ansible/

  format:
    desc: Auto-fix Ansible lint findings
    cmds:
      - uv run ansible-lint --fix ansible/

  validate:
    desc: Syntax-check the Ansible build playbook
    cmds:
      - uv run ansible-playbook ansible/build.yml --syntax-check -e device=rg477m -e image_device=
      - uv run ansible-playbook ansible/build.yml --syntax-check -e device=trimui-brick -e image_size_mib=1024

  container:
    desc: Build the builder container image
    cmds:
      - docker build -t sbc-imager-builder:local .

  image:
    desc: Build the container and produce a card image
    deps:
      - container
    cmds:
      - >-
        uv run ansible-playbook ansible/build.yml
        -e device={{.DEVICE}}
        {{if .SIZE_MIB}}-e image_size_mib={{.SIZE_MIB}}{{end}} {{if .IMAGE_DEVICE}}-e image_device={{.IMAGE_DEVICE}}{{end}}
        -e payload_dir={{.PAYLOAD_DIR}}
        -e dist_dir={{.DIST_DIR}}
        -e image_output={{.DIST_DIR}}/{{.DEVICE}}.img

  test:
    desc: Run the payload and image smoke tests
    cmds:
      - tests/ansible-payload.sh
      - tests/ansible-payload-nextui.sh
      - tests/smoke-image.sh

  ci:
    desc: Run the local CI gate
    cmds:
      - task: lint
      - task: validate
      - task: test
