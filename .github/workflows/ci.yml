name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    name: lint, validate, container, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Install shellcheck and unzip
        run: sudo apt-get update && sudo apt-get install -y shellcheck unzip exfat-fuse exfatprogs
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: task lint
      - name: Validate
        run: task validate
      - name: Build builder container
        run: task container
      - name: Smoke and payload tests
        run: task test
