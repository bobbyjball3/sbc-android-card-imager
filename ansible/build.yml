---
# Stage a device payload tree and invoke the container builder.
#
# `payload_profile` selects the on-card tree. `cannoli` loads
# ansible/vars/cannoli.yml (17 base directories + 51 platform Roms directories
# plus the Obtainium directory) and runs ansible/tasks/payload-cannoli.yml.
# Other profiles supply their own vars file and task file.
#
# Size resolution, in order:
#   1. image_device (optional): read-only `diskutil info -plist` + `plutil`.
#      The WholeDisk flag must be `true`; image_size_mib = TotalSize // 1 MiB.
#   2. Otherwise image_size_mib comes from the device vars file or `-e`.
#   3. Neither => the final assert fails. No block device is ever written.
#
# The container is the only task NOT tagged `payload` (it is tagged `image`):
# payload tree + size + label in, `.img` out (container boundary, IS-4).
#
# Remote assets use `ansible.builtin.get_url` with `force: no`. GitHub release
# URLs answer a 302 redirect to objects.githubusercontent.com; get_url follows
# it. If a redirect/403 failure shows up, switch ONLY this task to
# `ansible.builtin.uri` with `follow_redirects: all`.

- name: Stage device payload and build card image
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    device: rg477m
    payload_profile: cannoli
    # Anchored to the repository root (playbook_dir/..). Ansible's file/copy
    # actions resolve relative paths against the playbook directory, but
    # `realpath` in the container task resolves them against the process cwd -
    # so a relative default staged the tree under ansible/build/payload while
    # the mount read the empty repo-root build/payload, publishing an image
    # with a clean but empty filesystem. The normalize task below also lifts
    # any relative -e override onto this same base.
    repo_root: "{{ playbook_dir }}/.."
    payload_dir: "{{ repo_root }}/build/payload"
    dist_dir: "{{ repo_root }}/dist"
    image_output: "{{ repo_root }}/dist/{{ device }}.img"
    cache_dir: "{{ repo_root }}/build/cache"
    remote_assets: []
    remote_archives: []
    local_files: []
    local_dirs: []

  vars_files:
    - "vars/{{ device }}.yml"

  tasks:
    - name: Validate payload profile
      ansible.builtin.assert:
        that:
          - payload_profile in ['cannoli', 'nextui']
        fail_msg: >-
          Unsupported payload_profile '{{ payload_profile }}'. Valid profiles
          are 'cannoli' and 'nextui'; set payload_profile in the device vars
          file or with -e payload_profile=<name>.
        quiet: true
      tags: payload

    - name: Load payload profile vars
      ansible.builtin.include_vars:
        file: "vars/{{ payload_profile }}.yml"
      tags: payload

    - name: Clean and recreate payload staging directory
      ansible.builtin.file:
        path: "{{ payload_dir }}"
        state: "{{ item }}"
        mode: "0755"
      loop:
        - absent
        - directory
      tags: payload

    - name: Stage Cannoli payload profile
      ansible.builtin.include_tasks: tasks/payload-cannoli.yml
      when: payload_profile == 'cannoli'
      tags: payload

    - name: Stage NextUI payload profile
      ansible.builtin.include_tasks: tasks/payload-nextui.yml
      when: payload_profile == 'nextui'
      tags: payload

    - name: Stage pinned remote archives
      when: remote_archives | length > 0
      tags: payload
      block:
        - name: Ensure archive cache directory exists
          ansible.builtin.file:
            path: "{{ cache_dir }}"
            state: directory
            mode: "0755"

        - name: Validate remote archive entries
          ansible.builtin.assert:
            that:
              - (['repo', 'tag', 'asset', 'sha256', 'dest'] | difference(item.keys() | list)) | length == 0
              - item.repo is string
              - item.repo | length > 0
              - item.tag is string
              - item.tag | length > 0
              - item.asset is string
              - item.asset | length > 0
              - item.sha256 is string
              - item.sha256 | length == 64
              - item.sha256 is match('^[0-9a-f]{64}$')
              - item.dest is string
              - item.dest | length > 0
              - (item.executables | default([])) is sequence
            fail_msg: >-
              Invalid remote_archives entry {{ item.asset | default('unknown') }}:
              required keys repo/tag/asset/sha256/dest (strings), sha256 64 hex,
              dest non-empty, executables optional list.
            quiet: true
          loop: "{{ remote_archives }}"
          loop_control:
            label: "{{ item.asset | default('entry') }}"

        - name: Assert remote archive assets are unique
          ansible.builtin.assert:
            that:
              - (remote_archives | map(attribute='asset') | list | unique | length) == (remote_archives | length)
            fail_msg: "remote_archives contains duplicate asset names; cache key would collide."
            quiet: true

        - name: Create remote archive destination directories
          ansible.builtin.file:
            path: "{{ payload_dir }}/{{ item.dest }}"
            state: directory
            mode: "0755"
          loop: "{{ remote_archives }}"

        - name: Stat existing cached remote archives
          ansible.builtin.stat:
            path: "{{ cache_dir }}/{{ item.asset }}"
            checksum_algorithm: sha256
          loop: "{{ remote_archives }}"
          register: cached_archive_stats

        - name: Reject corrupted cached remote archives
          ansible.builtin.assert:
            that:
              - not item.stat.exists or item.stat.checksum == item.item.sha256
            fail_msg: >-
              Cached archive {{ item.item.asset }} does not match its pinned
              SHA-256 (expected {{ item.item.sha256 }}, got
              {{ item.stat.checksum | default('missing') }}). Delete it from
              {{ cache_dir }} and rebuild.
            quiet: true
          loop: "{{ cached_archive_stats.results }}"
          loop_control:
            label: "{{ item.item.asset }}"

        - name: Download pinned remote archives to cache
          ansible.builtin.get_url:
            url: "https://github.com/{{ item.repo }}/releases/download/{{ item.tag }}/{{ item.asset }}"
            dest: "{{ cache_dir }}/{{ item.asset }}"
            checksum: "sha256:{{ item.sha256 }}"
            force: false
            timeout: 600
            mode: "0644"
          loop: "{{ remote_archives }}"

        - name: Stat cached remote archives
          ansible.builtin.stat:
            path: "{{ cache_dir }}/{{ item.asset }}"
            checksum_algorithm: sha256
          loop: "{{ remote_archives }}"
          register: archive_stats

        - name: Verify cached remote archive checksums
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.checksum == item.item.sha256
            fail_msg: >-
              Cached archive {{ item.item.asset }} does not match its pinned
              SHA-256 (expected {{ item.item.sha256 }}, got
              {{ item.stat.checksum | default('missing') }}). Delete it from
              {{ cache_dir }} and rebuild.
            quiet: true
          loop: "{{ archive_stats.results }}"
          loop_control:
            label: "{{ item.item.asset }}"

        - name: Extract pinned remote archives into payload
          ansible.builtin.unarchive:
            src: "{{ cache_dir }}/{{ item.asset }}"
            dest: "{{ payload_dir }}/{{ item.dest }}"
            remote_src: true
          loop: "{{ remote_archives }}"

        - name: Make pak binaries executable
          ansible.builtin.file:
            path: "{{ payload_dir }}/{{ item.0.dest }}/{{ item.1 }}"
            state: file
            mode: "0755"
          loop: "{{ remote_archives | selectattr('executables', 'defined') | list | subelements('executables') }}"
          loop_control:
            label: "{{ item.0.asset }}:{{ item.1 }}"

    - name: Create remote asset destination directories
      ansible.builtin.file:
        path: "{{ payload_dir }}/{{ item.dest | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ remote_assets }}"
      when: (item.dest | dirname) | length > 0
      tags: payload

    - name: Download remote release assets
      ansible.builtin.get_url:
        url: "https://github.com/{{ item.repo }}/releases/download/{{ item.tag }}/{{ item.asset }}"
        dest: "{{ payload_dir }}/{{ item.dest }}"
        mode: "0644"
        force: false
        timeout: 120
      loop: "{{ remote_assets }}"
      tags: payload

    - name: Create local file destination directories
      ansible.builtin.file:
        path: "{{ payload_dir }}/{{ item.dest | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ local_files }}"
      when: (item.dest | dirname) | length > 0
      tags: payload

    - name: Copy local payload files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "{{ payload_dir }}/{{ item.dest }}"
        mode: "0644"
      loop: "{{ local_files }}"
      tags: payload

    - name: Copy local payload directories
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "{{ payload_dir }}/{{ item.dest }}"
        mode: "0644"
      loop: "{{ local_dirs }}"
      tags: payload

    - name: Resolve image size from target device (read-only)
      when: image_device | default('') | length > 0
      tags: payload
      block:
        - name: Query target device geometry
          ansible.builtin.command: diskutil info -plist "{{ image_device }}"
          register: diskutil_raw
          changed_when: false
          failed_when: false

        - name: Ensure build directory exists
          ansible.builtin.file:
            path: "{{ repo_root }}/build"
            state: directory
            mode: "0755"

        - name: Write device plist for parsing
          ansible.builtin.copy:
            content: "{{ diskutil_raw.stdout }}"
            dest: "{{ repo_root }}/build/disk.plist"
            mode: "0600"

        - name: Extract whole-disk flag
          ansible.builtin.command: plutil -extract WholeDisk raw -o - "{{ repo_root }}/build/disk.plist"
          register: whole_raw
          changed_when: false

        - name: Assert target is a whole disk
          ansible.builtin.assert:
            that:
              - whole_raw.stdout | trim == "true"
            fail_msg: >-
              Device {{ image_device }} is not a whole disk (WholeDisk flag is
              not true); refusing to size the image from it.

        - name: Extract total device size
          ansible.builtin.command: plutil -extract TotalSize raw -o - "{{ repo_root }}/build/disk.plist"
          register: size_raw
          changed_when: false

        - name: Compute image size in MiB
          ansible.builtin.set_fact:
            image_size_mib: "{{ (size_raw.stdout | trim | int) // 1048576 }}"

    - name: Validate image size
      ansible.builtin.assert:
        that:
          - image_size_mib is defined
          - (image_size_mib | default(0) | int) >= 2
        fail_msg: >-
          image_size_mib must be defined and at least 2 MiB (got
          '{{ image_size_mib | default("undefined") }}'). Pass -e
          image_size_mib=N or -e image_device=/dev/diskN.
      tags: payload

    - name: Validate NextUI minimum image size
      ansible.builtin.assert:
        that:
          - payload_profile != 'nextui' or (image_size_mib | int) >= 1024
        fail_msg: >-
          The NextUI payload needs an image of at least 1024 MiB (got
          '{{ image_size_mib }}'). Pass -e image_size_mib=N (>= 1024) or
          -e image_device=/dev/diskN.
        quiet: true
      tags: payload

    - name: Show resolved image size and output path
      ansible.builtin.debug:
        msg:
          - "image_size_mib: {{ image_size_mib }}"
          - "image_output: {{ image_output }}"
      tags: payload

    - name: Ensure distribution directory exists
      ansible.builtin.file:
        path: "{{ dist_dir }}"
        state: directory
        mode: "0755"
      tags: payload

    - name: Resolve host uid
      ansible.builtin.command: id -u
      register: host_uid
      changed_when: false
      tags: payload

    - name: Resolve host gid
      ansible.builtin.command: id -g
      register: host_gid
      changed_when: false
      tags: payload

    # Ansible's file/copy staging resolves a relative path against the playbook
    # directory while `realpath` here would use the process cwd; for a relative
    # path the two split and the container mounts an empty tree (clean exFAT,
    # zero files). Rebase any relative value on playbook_dir so the mount
    # source is exactly the directory the staging tasks wrote to.
    - name: Resolve container mount paths
      ansible.builtin.set_fact:
        mount_payload: "{{ payload_dir if payload_dir.startswith('/') else playbook_dir ~ '/' ~ payload_dir }}"
        mount_dist: "{{ dist_dir if dist_dir.startswith('/') else playbook_dir ~ '/' ~ dist_dir }}"
      tags: image

    - name: Build card image in assembler container
      ansible.builtin.command: >-
        docker run --rm --privileged
        -e HOST_UID={{ host_uid.stdout }}
        -e HOST_GID={{ host_gid.stdout }}
        -v {{ mount_payload }}:/payload:ro
        -v {{ mount_dist }}:/out
        sbc-imager-builder:local
        /payload /out/{{ (image_output | basename) }} {{ image_size_mib }} {{ image_label }}
      changed_when: true
      tags: image
