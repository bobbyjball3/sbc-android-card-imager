---
# Device payload vars for the Retroid Pocket Nova running Cannoli.
#
# The Nova uses a Qualcomm QCS8550 (Snapdragon 8 Gen 2 class) and runs
# Android 13, installing arm64-v8a APKs. The payload is the shared Cannoli
# contract plus arm64-v8a Obtainium / Emulation Pack / Tailscale imports.
#
# remote_assets resolve to these exact GitHub release URLs:
#   https://github.com/ImranR98/Obtainium/releases/download/v1.7.1/app-arm64-v8a-release.apk
#   https://github.com/RJNY/Obtainium-Emulation-Pack/releases/download/v8.0.1/obtainium-emulation-pack-v8.0.1.json
#
# RGC-Overlay-Pack v1.0 supplies the shaders and overlays. It ships no release
# asset, so remote_archives pins the tag source tarball directly. Overlay PNGs
# are mapped onto Cannoli's per-platform Overlays/<TAG> dirs; the generic CRT
# bezel is copied to the 4:3 home-console tags in rgc_crt_tags.
device: rp-nova
payload_profile: cannoli
image_label: NOVA
image_device: /dev/disk5
image_size_mib: 488156
image_output: dist/rp-nova.img

remote_assets:
  - repo: ImranR98/Obtainium
    tag: v1.7.1
    asset: app-arm64-v8a-release.apk
    dest: APKs/Obtainium.apk
  - repo: RJNY/Obtainium-Emulation-Pack
    tag: v8.0.1
    asset: obtainium-emulation-pack-v8.0.1.json
    dest: Obtainium/obtainium-emulation-pack-v8.0.1.json

# RGC overlay PNGs copied into Cannoli/Overlays/<TAG>/ for handheld platforms.
rgc_overlays:
  GB:
    - Jeltron_GB-DMG.png
    - Perfect_GB-DMG.png
  GBC:
    - Jeltron_GB-Color.png
    - Perfect_GBC.png
  GBA:
    - Jeltron_GBA.png
    - Perfect_GBA.png

# The generic Jeltron_CRT bezel is copied to these 4:3 home-console tags.
rgc_crt_overlay: Jeltron_CRT.png
rgc_crt_tags:
  - NES
  - FDS
  - SNES
  - N64
  - SMS
  - MD
  - SG1000
  - 32X
  - SEGACD
  - SATURN
  - DC
  - PS
  - PS2
  - GC
  - WII
  - PCE
  - PCFX
  - SUPERGRAFX
  - NEOGEO
  - ATARI2600
  - ATARI5200
  - ATARI7800
  - COLECOVISION
  - INTELLIVISION
  - VECTREX
  - JAGUAR

# RGC GLSL shader presets (Cannoli/Shaders) and their referenced sources
# (Cannoli/Shaders/shaders). Slang shaders are omitted: Cannoli purges them.
rgc_shaders:
  presets:
    - crt-1tap.glslp
    - sharp-shimmerless.glslp
    - zfast_crt_geo_svideo.glslp
  sources:
    - crt-1tap.glsl
    - sharp-shimmerless.glsl
    - zfast_crt_geo_svideo.glsl

remote_archives:
  - url: https://github.com/retrogamecorps/RGC-Overlay-Pack/archive/refs/tags/v1.0.tar.gz
    asset: RGC-Overlay-Pack-v1.0.tar.gz
    sha256: e809eaf0717beaab90922229a7dfd665f8bb50ac6f80556e53758969e05926aa
    dest: .rgc-src
    extra_opts:
      - --strip-components=1

local_files:
  - src: ansible/files/rp-nova/tailscale.json
    dest: Obtainium/tailscale.json

local_dirs: []
